name: Android
on:
  push: { branches: [main], paths: ['android/**', 'public/**', 'package*.json', 'capacitor.config.json', '.github/workflows/android.yml'] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - run: npx cap sync android
      - name: Build debug APK and unsigned release bundle
        working-directory: android
        # files uploaded through the GitHub website lose the executable bit
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/bundle/release/*.aab
