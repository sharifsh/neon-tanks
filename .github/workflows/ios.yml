name: iOS (simulator compile)
on:
  push: { branches: [main], paths: ['ios/**', 'public/**', 'package*.json', 'capacitor.config.json', '.github/workflows/ios.yml'] }
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - name: Select Xcode 26+
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          sudo xcode-select -s "${XC:-/Applications/Xcode.app}/Contents/Developer"
          xcodebuild -version
      - run: npm ci
      - run: npx cap sync ios
      - run: |
          xcodebuild build -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -skipPackagePluginValidation -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO
